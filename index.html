<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Kana · Hiragana &amp; Katakana</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{

    --paper:#F7F2E7;
    --paper-cell:#FFFDF8;
    --paper-line:#DED4BC;
    --ink:#241F18;
    --ink-soft:#7A705E;
    --indigo:#2B3A67;
    --indigo-deep:#1C2747;
    --vermilion:#BD4327;
    --vermilion-soft:rgba(189,67,39,.10);
    --shadow:0 2px 10px rgba(36,31,24,.06);
    --radius:6px;

}

body.dark{

    --paper:#15141A;
    --paper-cell:#1E1C24;
    --paper-line:#33303C;
    --ink:#EDE7DA;
    --ink-soft:#948C7C;
    --indigo:#7C93D6;
    --indigo-deep:#AFC0F0;
    --vermilion:#E37A52;
    --vermilion-soft:rgba(227,122,82,.14);
    --shadow:0 2px 14px rgba(0,0,0,.35);

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Zen Kaku Gothic New', sans-serif;
    background-color:var(--paper);
    color:var(--ink);
    padding:36px 20px 60px;
    transition:background-color .35s ease, color .35s ease;

    background-image:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:34px 34px;
    background-position:center top;

}

body::before{

    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-color:var(--paper);
    opacity:.55;
    z-index:-1;
    transition:background-color .35s ease;

}

/* ---------- HEADER ---------- */

.page-head{

    max-width:980px;
    margin:0 auto 30px;
    display:flex;
    align-items:center;
    gap:20px;

}

.kanji-mark{

    font-family:'Shippori Mincho', serif;
    font-size:56px;
    font-weight:800;
    color:var(--vermilion);
    line-height:1;
    flex-shrink:0;

}

h1{

    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:.02em;
    margin-bottom:4px;

}

.subtitle{

    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:.03em;

}

/* ---------- TOOLBAR ---------- */

.toolbar{

    max-width:980px;
    margin:0 auto 34px;
    background:var(--paper-cell);
    border:1px solid var(--paper-line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:14px 18px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    transition:background-color .35s ease, border-color .35s ease;

}

.field{

    display:flex;
    flex-direction:column;
    gap:4px;

}

.field label{

    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);

}

select{

    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    padding:9px 34px 9px 12px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:var(--paper-cell);
    color:var(--ink);
    cursor:pointer;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%237A705E'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    transition:border-color .2s ease;

}

select:hover{ border-color:var(--vermilion); }
select:focus-visible{ outline:2px solid var(--vermilion); outline-offset:2px; }

/* ---------- NAV / DARK TOGGLE ---------- */

.nav-btn,
button{

    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:9px 16px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:var(--paper-cell);
    color:var(--ink);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:border-color .2s ease, color .2s ease;

}

.nav-button{

    margin-left:auto;

}

.nav-btn:hover,
button:hover{ border-color:var(--vermilion); color:var(--vermilion); background:var(--paper-cell); }

.nav-btn:focus-visible,
button:focus-visible{ outline:2px solid var(--vermilion); outline-offset:2px; }

/* ---------- GRID ---------- */

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    max-width:980px;
    margin:0 auto;
}

.grid.table-mode{

    grid-template-columns:repeat(5,1fr) !important;


}

.grid.yoon-mode{

    grid-template-columns:repeat(3,1fr) !important;
    max-width:520px;

}

.grid.numbers-mode{

    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));

}

.card.blank{

    visibility:hidden;
    pointer-events:none;

}

.card{

    position:relative;
    height:64px;
    perspective:1000px;
    cursor:pointer;

}

.inner{

    width:100%;
    height:100%;
    position:relative;
    transition:transform .5s cubic-bezier(.4,.1,.2,1);
    transform-style:preserve-3d;

}

.card.flipped .inner{

    transform:rotateY(180deg);

}

@media (prefers-reduced-motion:reduce){
    .inner{ transition:none; }
}

.front,
.back{

    position:absolute;
    inset:0;
    border-radius:var(--radius);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:4px;
    line-height:1.2;
    word-break:break-word;
    backface-visibility:hidden;
    border:1px solid var(--paper-line);
    box-shadow:var(--shadow);

}
  .nav-btn {
    margin-left: auto;
} 

.front{

    background:var(--paper-cell);
    color:var(--ink);
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:26px;

}

@media only screen and (max-width: 500px) {
    .front{ font-size:21px; }
}

.grid.numbers-mode .front{

    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:13.5px;

}

.back{

    background:var(--indigo);
    color:#F7F2E7;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    font-weight:500;
    transform:rotateY(180deg);
    border-color:var(--indigo-deep);

}

.grid.numbers-mode .back{

    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;

}

.card:hover .front,
.card:hover .back{

    border-color:var(--vermilion);

}

/* ---------- DARK MODE ---------- */

body.dark{

    background-image:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:34px 34px;

}

body.dark .subtitle{

    color:var(--ink-soft);

}

@media (max-width:520px){

    .kanji-mark{ font-size:42px; }
    h1{ font-size:22px; }
    button{ margin-left:0; }

}

</style>

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

    let source;
    if(scriptSel.value === "katakana"){
        source = katakanaChars;
    }else if(scriptSel.value === "numbers"){
        source = numbersChars;
    }else{
        source = hiraganaChars;
    }

    filter.style.display = scriptSel.value === "numbers" ? "none" : "inline-block";
    grid.classList.toggle("numbers-mode", scriptSel.value === "numbers");

    const isJpScript = (scriptSel.value === "hiragana" || scriptSel.value === "katakana");

    const useTableLayout =
        isJpScript &&
        filter.value === "basic" &&
        mode.value === "normal";

    const useYoonLayout =
        isJpScript &&
        filter.value === "yoon" &&
        mode.value === "normal";

    grid.classList.toggle("table-mode", useTableLayout);
    grid.classList.toggle("yoon-mode", useYoonLayout);

    if(useTableLayout){

        const lookup = {};
        source.filter(c=>c.type==="basic").forEach(c=>{ lookup[c.en]=c; });

        gojuonRows.forEach(row=>{
            row.forEach(code=>{

                const card=document.createElement("div");

                if(code===null || !lookup[code]){
                    card.className="card blank";
                    grid.appendChild(card);
                    return;
                }

                const item=lookup[code];

                card.className="card";

                card.innerHTML=`
                    <div class="inner">
                        <div class="front">${item.jp}</div>
                        <div class="back">${item.en}</div>
                    </div>
                `;

                card.addEventListener("click",()=>{
                    card.classList.toggle("flipped");
                });

                grid.appendChild(card);

            });
        });

        return;
    }

    if(useYoonLayout){

        const lookup = {};
        source.filter(c=>c.type==="yoon").forEach(c=>{ lookup[c.en]=c; });

        yoonRows.forEach(row=>{
            row.forEach(code=>{

                const card=document.createElement("div");

                if(!lookup[code]){
                    card.className="card blank";
                    grid.appendChild(card);
                    return;
                }

                const item=lookup[code];

                card.className="card";

                card.innerHTML=`
                    <div class="inner">
                        <div class="front">${item.jp}</div>
                        <div class="back">${item.en}</div>
                    </div>
                `;

                card.addEventListener("click",()=>{
                    card.classList.toggle("flipped");
                });

                grid.appendChild(card);

            });
        });

        return;
    }

    let cards;

    if(filter.value==="all"){
        cards=[...source];
    }else{
        cards=source.filter(card=>card.type===filter.value);
    }

    // Shuffle only when Shuffle mode is selected
    if(mode.value==="shuffle"){
        shuffle(cards);
    }

    cards.forEach(item=>{

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`
            <div class="inner">
                <div class="front">${item.jp}</div>
                <div class="back">${item.en}</div>
            </div>
        `;

        card.addEventListener("click",()=>{
            card.classList.toggle("flipped");
        });

        grid.appendChild(card);

    });


}

render();

// =====================
// Controls
// =====================

scriptSel.addEventListener("change",render);
mode.addEventListener("change",render);
filter.addEventListener("change",render);

// =====================
// Dark Mode
// =====================

const themeBtn=document.getElementById("theme");

if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
    themeBtn.textContent="☀️ Light";
}

themeBtn.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        themeBtn.textContent="☀️ Light";
    }else{
        localStorage.setItem("theme","light");
        themeBtn.textContent="🌙 Dark";
    }

});
  
  document.getElementById("script").addEventListener("change", function () {
    if (this.value === "numbers") {
        window.location.href = "/japanese-lang/numbers-flash-cards.html";
        return;
    }

    // Nothing else happens here.
    // Your existing Hiragana/Katakana code will continue to work.
});

</script>
