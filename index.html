<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiragana Flash Cards</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f4f6f8;
padding:30px;

}

h1{

text-align:center;
margin-bottom:20px;

}

.controls{

display:flex;
justify-content:center;
margin-bottom:25px;

}

button{

padding:12px 25px;
font-size:18px;
border:none;
background:#2196f3;
color:white;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#0d82df;

}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    max-width:1100px;
    margin:auto;
}

@media (max-width:1000px){
    .grid{
        grid-template-columns:repeat(8,1fr);
    }
}

@media (max-width:800px){
    .grid{
        grid-template-columns:repeat(6,1fr);
    }
}

@media (max-width:600px){
    .grid{
        grid-template-columns:repeat(4,1fr);
    }
}

.card{

height:90px;
perspective:1000px;
cursor:pointer;

}

.inner{

width: 95%;
height: 80%;
position:relative;
transition:.6s;
transform-style:preserve-3d;

}

.card.flipped .inner{

transform:rotateY(180deg);

}

.front,
.back{

position:absolute;
width:100%;
height:100%;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
backface-visibility:hidden;
box-shadow:0 3px 8px rgba(0,0,0,.15);

}

.front{

background:white;
font-size:38px;

}

.back{

background:#4caf50;
color:white;
font-size:22px;
transform:rotateY(180deg);

}
  /* ---------- DARK MODE ---------- */

body{
    transition:.3s;
}

button,
select{
    transition:.3s;
}

.card .front,
.card .back{
    transition:.3s;
}

body.dark{

    background:#111827;
    color:#fff;

}

body.dark .front{

    background:#1f2937;
    color:#fff;

}

body.dark .back{

    background:#2563eb;
    color:white;

}

body.dark button{

    background:#2563eb;

}

body.dark button:hover{

    background:#1d4ed8;

}

body.dark select{

    background:#1f2937;
    color:white;
    border:1px solid #555;

}
  select{

padding:12px 18px;
font-size:18px;
border:none;
border-radius:8px;
margin:0 10px;
cursor:pointer;
background:white;

}

</style>
</head>
<body>

<div class="controls">

   <select id="mode">
    <option value="normal">📖 Normal</option>
    <option value="shuffle">🔀 Shuffle</option>
</select>

    <select id="filter">
        <option value="all">All</option>
        <option value="basic">Basic</option>
        <option value="dakuten">Dakuten</option>
        <option value="handakuten">Handakuten</option>

    <button id="theme">🌙 Dark</button>

</div>

<div class="grid" id="grid"></div>

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

const grid=document.getElementById("grid");
const filter=document.getElementById("filter");
  const mode = document.getElementById("mode");

function render(){

    grid.innerHTML="";

    let cards;

    if(filter.value==="all"){
        cards=[...chars];
    }else{
        cards=chars.filter(card=>card.type===filter.value);
    }

    // Shuffle only when Shuffle mode is selected
    if(mode.value==="shuffle"){
        shuffle(cards);
    }

    cards.forEach(item=>{

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`
            <div class="inner">
                <div class="front">${item.jp}</div>
                <div class="back">${item.en}</div>
            </div>
        `;

        card.addEventListener("click",()=>{
            card.classList.toggle("flipped");
        });

        grid.appendChild(card);

    });


}

render();

// =====================
// Buttons
// =====================

mode.addEventListener("change",render);
filter.addEventListener("change",render);

filter.addEventListener("change",render);

// =====================
// Dark Mode
// =====================

const themeBtn=document.getElementById("theme");

if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
    themeBtn.textContent="☀️ Light";
}

themeBtn.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        themeBtn.textContent="☀️ Light";
    }else{
        localStorage.setItem("theme","light");
        themeBtn.textContent="🌙 Dark";
    }

});

</script>
