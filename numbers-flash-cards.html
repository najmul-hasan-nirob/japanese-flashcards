<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Numbers · 1–10,000</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{

    --paper:#F7F2E7;
    --paper-cell:#FFFDF8;
    --paper-line:#DED4BC;
    --ink:#241F18;
    --ink-soft:#7A705E;
    --indigo:#2B3A67;
    --indigo-deep:#1C2747;
    --vermilion:#BD4327;
    --vermilion-soft:rgba(189,67,39,.10);
    --shadow:0 2px 10px rgba(36,31,24,.06);
    --radius:6px;

}

body.dark{

    --paper:#15141A;
    --paper-cell:#1E1C24;
    --paper-line:#33303C;
    --ink:#EDE7DA;
    --ink-soft:#948C7C;
    --indigo:#7C93D6;
    --indigo-deep:#AFC0F0;
    --vermilion:#E37A52;
    --vermilion-soft:rgba(227,122,82,.14);
    --shadow:0 2px 14px rgba(0,0,0,.35);

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Zen Kaku Gothic New', sans-serif;
    background-color:var(--paper);
    color:var(--ink);
    padding:36px 20px 60px;
    transition:background-color .35s ease, color .35s ease;

    background-image:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:34px 34px;
    background-position:center top;

}

body.dark{

    background-image:
        linear-gradient(var(--paper-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:34px 34px;

}

body::before{

    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-color:var(--paper);
    opacity:.55;
    z-index:-1;
    transition:background-color .35s ease;

}

/* ---------- HEADER ---------- */

.page-head{

    max-width:980px;
    margin:0 auto 30px;
    display:flex;
    align-items:center;
    gap:20px;

}

.kanji-mark{

    font-family:'Shippori Mincho', serif;
    font-size:56px;
    font-weight:800;
    color:var(--vermilion);
    line-height:1;
    flex-shrink:0;

}

h1{

    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:.02em;
    margin-bottom:4px;

}

.subtitle{

    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:.03em;

}

/* ---------- TOOLBAR ---------- */

.toolbar{

    max-width:980px;
    margin:0 auto 34px;
    background:var(--paper-cell);
    border:1px solid var(--paper-line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:14px 18px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    transition:background-color .35s ease, border-color .35s ease;

}

.field{

    display:flex;
    flex-direction:column;
    gap:4px;

}

.field label{

    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);

}

select{

    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    padding:9px 34px 9px 12px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:var(--paper-cell);
    color:var(--ink);
    cursor:pointer;
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%237A705E'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    transition:border-color .2s ease;

}

select:hover{ border-color:var(--vermilion); }
select:focus-visible{ outline:2px solid var(--vermilion); outline-offset:2px; }

/* ---------- SOROBAN TOGGLE ---------- */

.abacus{

    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    user-select:none;
    padding:9px 14px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:var(--paper-cell);
    transition:border-color .2s ease;

}

.abacus:hover{ border-color:var(--vermilion); }
.abacus:focus-visible{ outline:2px solid var(--vermilion); outline-offset:2px; }

.abacus-label{

    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    transition:color .2s ease, font-weight .2s ease;

}

.abacus-label.active{

    color:var(--vermilion);
    font-weight:600;

}

.rod{

    position:relative;
    width:52px;
    height:3px;
    background:var(--ink-soft);
    border-radius:2px;

}

.bead{

    position:absolute;
    top:50%;
    left:0;
    width:20px;
    height:20px;
    border-radius:50%;
    background:var(--vermilion);
    box-shadow:0 1px 4px rgba(0,0,0,.25);
    transform:translate(0,-50%);
    transition:transform .28s cubic-bezier(.5,-0.3,.5,1.3);

}

.abacus.right .bead{

    transform:translate(32px,-50%);

}

@media (prefers-reduced-motion:reduce){
    .bead{ transition:none; }
}

/* ---------- NAV / DARK TOGGLE ---------- */

.nav-btn,
.theme-btn{

    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    padding:9px 16px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:var(--paper-cell);
    color:var(--ink);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:border-color .2s ease, color .2s ease;

}

.nav-btn{

    margin-left:auto;

}

.nav-btn:hover,
.theme-btn:hover{ border-color:var(--vermilion); color:var(--vermilion); }

.nav-btn:focus-visible,
.theme-btn:focus-visible{ outline:2px solid var(--vermilion); outline-offset:2px; }

/* ---------- GRID ---------- */

.grid{

    max-width:980px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px;

}

.card{

    position:relative;
    height:64px;
    perspective:1000px;
    cursor:pointer;

}

.inner{

    width:100%;
    height:100%;
    position:relative;
    transition:transform .5s cubic-bezier(.4,.1,.2,1);
    transform-style:preserve-3d;

}

.card.flipped .inner{

    transform:rotateY(180deg);

}

@media (prefers-reduced-motion:reduce){
    .inner{ transition:none; }
}

.front,
.back{

    position:absolute;
    inset:0;
    border-radius:var(--radius);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:4px;
    line-height:1.2;
    word-break:break-word;
    backface-visibility:hidden;
    border:1px solid var(--paper-line);
    box-shadow:var(--shadow);

}

.front{

    background:var(--paper-cell);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:13.5px;
    font-weight:500;

}

.back{

    background:var(--indigo);
    color:#F7F2E7;
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    transform:rotateY(180deg);
    border-color:var(--indigo-deep);

}

.card:hover .front,
.card:hover .back{

    border-color:var(--vermilion);

}

.card.milestone .front::after,
.card.milestone .back::after{

    content:"";
    position:absolute;
    top:5px;
    right:5px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--vermilion);

}

/* ---------- FOOTNOTE ---------- */

.footnote{

    max-width:980px;
    margin:26px auto 0;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:8px;

}

.footnote .dot{

    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--vermilion);
    flex-shrink:0;

}

@media (max-width:520px){

    .kanji-mark{ font-size:42px; }
    h1{ font-size:22px; }
    .nav-btn{ margin-left:0; }

}

</style>
</head>
<body>

<div class="page-head">
    <div class="kanji-mark">数</div>
    <div>
        <h1>Japanese Numbers</h1>
        <div class="subtitle">1–1,000 IN FULL · 1,000–10,000 BY THOUSANDS</div>
    </div>
</div>

<div class="toolbar">

    <div class="field">
        <label for="range">Range</label>
        <select id="range">
            <option value="all">All</option>
            <option value="1-100">1 – 100</option>
            <option value="101-1000">101 – 1,000</option>
            <option value="thousands">Thousands</option>
        </select>
    </div>

    <div class="field">
        <label for="mode">Order</label>
        <select id="mode">
            <option value="normal">Normal</option>
            <option value="shuffle">Shuffle</option>
        </select>
    </div>

    <div class="field">
        <label>Shows first</label>
        <div class="abacus" id="direction" role="button" tabindex="0" aria-pressed="false">
            <span class="abacus-label left active">reading</span>
            <div class="rod"><div class="bead" id="bead"></div></div>
            <span class="abacus-label right">123</span>
        </div>
    </div>

    <a class="nav-btn" href="https://najmul-hasan-nirob.github.io/japanese-flashcards/">あ Kana Flashcards</a>

    <button class="theme-btn" id="theme">🌙 Dark</button>


</div>

<div class="grid" id="grid"></div>

<div class="footnote"><span class="dot"></span>marked cards are round-number milestones (hundreds &amp; thousands)</div>

<script>

// =====================
// Japanese number reading generator
// =====================

function numberToRomaji(n){

    if(n===0) return "zero";

    let remainder = n;

    const man = Math.floor(remainder/10000); remainder%=10000;
    const sen = Math.floor(remainder/1000); remainder%=1000;
    const hyaku = Math.floor(remainder/100); remainder%=100;
    const juu = Math.floor(remainder/10); remainder%=10;
    const ichi = remainder;

    const digitWords = ["","ichi","ni","san","yon","go","roku","nana","hachi","kyuu"];

    const hyakuWords = {
        1:"hyaku", 2:"nihyaku", 3:"sanbyaku", 4:"yonhyaku", 5:"gohyaku",
        6:"roppyaku", 7:"nanahyaku", 8:"happyaku", 9:"kyuuhyaku"
    };

    const senWords = {
        1:"sen", 2:"nisen", 3:"sanzen", 4:"yonsen", 5:"gosen",
        6:"rokusen", 7:"nanasen", 8:"hassen", 9:"kyuusen"
    };

    let result = "";

    if(man>0){ result += (man===1 ? "ichi" : digitWords[man]) + "man"; }
    if(sen>0){ result += senWords[sen]; }
    if(hyaku>0){ result += hyakuWords[hyaku]; }
    if(juu>0){ result += (juu===1 ? "" : digitWords[juu]) + "juu"; }
    if(ichi>0){ result += digitWords[ichi]; }

    return result;

}

// =====================
// Build the data set
// =====================

const numbersData = [];

for(let i=1;i<=1000;i++){
    numbersData.push({
        num:i,
        jp:numberToRomaji(i),
        range: i<=100 ? "1-100" : "101-1000",
        milestone: i % 100 === 0
    });
}

for(let i=2000;i<=10000;i+=1000){
    numbersData.push({
        num:i,
        jp:numberToRomaji(i),
        range:"thousands",
        milestone:true
    });
}

// =====================
// Helpers
// =====================

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

const grid=document.getElementById("grid");
const rangeSel=document.getElementById("range");
const mode=document.getElementById("mode");
const directionToggle=document.getElementById("direction");
const labelLeft=directionToggle.querySelector(".left");
const labelRight=directionToggle.querySelector(".right");

let showJapaneseFirst = true;

function render(){

    grid.innerHTML="";

    let cards;

    if(rangeSel.value==="all"){
        cards=[...numbersData];
    }else{
        cards=numbersData.filter(item=>item.range===rangeSel.value);
    }

    if(mode.value==="shuffle"){
        shuffle(cards);
    }

    const frag=document.createDocumentFragment();

    cards.forEach(item=>{

        const card=document.createElement("div");

        card.className="card" + (item.milestone ? " milestone" : "");

        const frontText = showJapaneseFirst ? item.jp : item.num;
        const backText = showJapaneseFirst ? item.num : item.jp;

        card.innerHTML=`
            <div class="inner">
                <div class="front">${frontText}</div>
                <div class="back">${backText}</div>
            </div>
        `;

        card.addEventListener("click",()=>{
            card.classList.toggle("flipped");
        });

        frag.appendChild(card);

    });

    grid.appendChild(frag);

}

render();

// =====================
// Controls
// =====================

rangeSel.addEventListener("change",render);
mode.addEventListener("change",render);

function toggleDirection(){

    showJapaneseFirst = !showJapaneseFirst;

    directionToggle.classList.toggle("right", !showJapaneseFirst);
    directionToggle.setAttribute("aria-pressed", String(!showJapaneseFirst));

    labelLeft.classList.toggle("active", showJapaneseFirst);
    labelRight.classList.toggle("active", !showJapaneseFirst);

    render();

}

directionToggle.addEventListener("click",toggleDirection);
directionToggle.addEventListener("keydown",(e)=>{
    if(e.key==="Enter" || e.key===" "){
        e.preventDefault();
        toggleDirection();
    }
});

// =====================
// Dark Mode
// =====================

const themeBtn=document.getElementById("theme");

if(localStorage.getItem("theme")==="dark"){
    document.body.classList.add("dark");
    themeBtn.textContent="☀️ Light";
}

themeBtn.addEventListener("click",()=>{

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("theme","dark");
        themeBtn.textContent="☀️ Light";
    }else{
        localStorage.setItem("theme","light");
        themeBtn.textContent="🌙 Dark";
    }

});

</script>

</body>
</html>
